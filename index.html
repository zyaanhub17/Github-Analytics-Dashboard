<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="XtoCGIUovc3ffWY6oxXGueRdJ99UN7jnWpB1tGI4Wqw" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GitScope - GitHub profile analytics dashboard">
    <title>GitScope — GitHub Analytics</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
</head>
<body>
    <div class="app-shell">
        <nav class="navbar">
            <div class="brand">git<span>Scope</span></div>
            <div class="nav-badge">GitHub REST API</div>
        </nav>

        <main>
            <section class="hero">
                <div class="hero-copy">
                    <p class="p-eyebrow">Developer analytics</p>
                    <h1>Understand a GitHub profile at a glance.</h1>
                    <p class="hero-text">
                        Explore repositories, followers, stars, forks, codebase footprints, and AI developer personas through a clean API-powered dashboard.
                    </p>
                </div>

                <form class="search-box" id="searchForm" style="flex-direction: column; align-items: stretch; gap: 12px; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; gap: 10px;">
        <input
            id="usernameInput"
            type="text"
            value="abue-ammar"
            placeholder="Enter GitHub username (e.g., octocat)"
            autocomplete="off"
            aria-label="GitHub username"
            style="flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff;"
        >
        <button type="submit" id="analyzeBtn" style="padding: 12px 24px; border-radius: 8px; background: #6366f1; color: #fff; font-weight: bold; border: none; cursor: pointer;">Analyze</button>
    </div>
    
    <div style="display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;">
        <input
            id="compareUsernameInput"
            type="text"
            placeholder="Enter another GitHub username to compare profiles"
            autocomplete="off"
            aria-label="Compare GitHub username"
            style="flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff;"
        >
        <button type="submit" style="padding: 12px 24px; border-radius: 8px; background: #3b82f6; color: #fff; font-weight: bold; border: none; cursor: pointer;">Compare</button>
    </div>
</form>
            </section>

            <div id="notice" class="notice">
                Demo data is loaded. Enter a public GitHub username and click Analyze.
            </div>

            <section id="dashboard" aria-live="polite"></section>
        </main>
    </div>

    <script type="module" src="./github-api.js"></script>
    <script type="module" src="./ui.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
